version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: truthlab-api:1.0.0
    container_name: truthlab-backend-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - PORT=8000
    env_file:
      - .env.example
    volumes:
      - api-uploads:/app/uploads
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M

volumes:
  api-uploads:
    driver: local
