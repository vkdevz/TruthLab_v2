[project]
name = "multimodal-evidence-verification"
version = "0.1.0"
description = "Multimodal Evidence-Aware Misinformation Verification System"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Pankaj Kumar" }
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "trafilatura>=1.8.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "numpy>=1.26.0",
    "pillow>=10.3.0",
    "scikit-learn>=1.5.0",
    "spacy>=3.7.4",
    "sentence-transformers>=3.0.0",
    "python-dateutil>=2.9.0",
    "dateparser>=1.2.0",
    "networkx>=3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.8",
]
heavy-media = [
    "easyocr>=1.7.1",
    "openai-whisper>=20231117",
    "scenedetect[opencv]>=0.6.4",
    "opencv-python-headless>=4.9.0.80",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"
